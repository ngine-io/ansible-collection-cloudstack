name: Collection Docs
concurrency:
  group: docs-push-${{ github.sha }}
  cancel-in-progress: true
'on':
  push:
    branches:
      - master
      - stable-*
    tags:
      - '*'
  # Run CI once per day (at 09:00 UTC)
  schedule:
    - cron: '0 9 * * *'
  # Allow manual trigger (for newer antsibull-docs, sphinx-ansible-theme, ... versions)
  workflow_dispatch:

jobs:
  build-docs:
    permissions:
      contents: read
    name: Build Ansible Docs
    uses: ansible-community/github-docs-build/.github/workflows/_shared-docs-build-push.yml@main
    with:
      ansible-ref: devel
      collection-name: ngine_io.cloudstack
      init-lenient: false
      init-fail-on-error: true
      squash-hierarchy: true
      init-project: CloudStack Collection
      init-copyright: ngine_io.cloudstack Contributors
      init-title: CloudStack Collection Documentation
      init-html-short-title: CloudStack Collection Docs
      init-extra-html-theme-options: |
        documentation_home_url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/branch/master/

  publish-docs-gh-pages:
    # for now we won't run this on forks
    if: github.repository == 'ngine-io/ansible-collection-cloudstack'
    permissions:
      contents: write
      pages: write
      id-token: write
    needs: [build-docs]
    name: Publish Ansible Docs
  steps:
    - name: Checkout gh-pages branch (create if missing)
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        fetch-depth: 0
      continue-on-error: true
    - name: Call shared docs publish workflow
      uses: ansible-community/github-docs-build/.github/workflows/_shared-docs-build-publish-gh-pages.yml@main
      with:
        artifact-name: ${{ needs.build-docs.outputs.artifact-name }}
        publish-gh-pages-branch: true
      secrets:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

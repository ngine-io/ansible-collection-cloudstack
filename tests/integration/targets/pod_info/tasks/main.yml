---
- name: setup zone is present
  ngine_io.cloudstack.zone:
    name: "{{ cs_resource_prefix }}-zone"
    dns1: 8.8.8.8
    dns2: 8.8.4.4
    network_type: Basic
  register: zone
- name: verify setup zone is present
  assert:
    that:
      - zone is successful

- name: setup pod is absent
  ngine_io.cloudstack.pod:
    name: "pod-info-{{ cs_resource_prefix }}-pod"
    zone: "{{ cs_resource_prefix }}-zone"
    state: absent
  register: pod
- name: verify setup pod is absent
  assert:
    that:
      - pod is successful

- name: setup pod is present
  ngine_io.cloudstack.pod:
    name: "pod-info-{{ cs_resource_prefix }}-pod"
    zone: "{{ cs_resource_prefix }}-zone"
    start_ip: 10.100.10.101
    gateway: 10.100.10.1
    netmask: 255.255.255.0
  register: pod
- name: verify setup pod is present
  assert:
    that:
      - pod is successful

- name: get info from pod
  ngine_io.cloudstack.pod_info:
    name: "pod-info-{{ cs_resource_prefix }}-pod"
    zone: "{{ cs_resource_prefix }}-zone"
  register: pod_info
- name: verify get info from pod
  assert:
    that:
      - pod_info is successful
      - pod_info is not changed
      - pod_info.pods | length == 1
      - pod_info.pods[0].name == "pod-info-" + cs_resource_prefix + "-pod"
      - pod_info.pods[0].zone == cs_resource_prefix + "-zone"
      - pod_info.pods[0].start_ip == "10.100.10.101"
      - pod_info.pods[0].gateway == "10.100.10.1"
      - pod_info.pods[0].netmask == "255.255.255.0"

- name: get info from all pods
  ngine_io.cloudstack.pod_info:
  register: pods
- name: verify get info from all pods
  assert:
    that:
      - pods is successful
      - pods is not changed
      - pods.pods | length > 0
      - '"name" in pods.pods[0]'

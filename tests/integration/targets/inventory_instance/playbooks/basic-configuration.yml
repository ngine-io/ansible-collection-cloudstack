---
- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    simulator: "{{ (lookup('env', 'CLOUDSTACK_ENDPOINT') | regex_replace('/client/api$', '')) if lookup('env', 'CLOUDSTACK_ENDPOINT') else 'http://172.17.0.2:8888' }}"
  tasks:
    - name: Retrieve Simulator Keys
      ansible.builtin.uri:
        url: "{{ simulator }}/admin.json"
        return_content: true
      register: admin
      until: admin is success
      retries: 5
      delay: 1

    - name: Create cloudstack.env
      ansible.builtin.template:
        src: templates/cloudstack.env.j2
        dest: ../cloudstack.env

    - name: Create cloudstack-instances.yml
      ansible.builtin.template:
        src: templates/cloudstack-instances.yml.j2
        dest: ../cloudstack-instances.yml

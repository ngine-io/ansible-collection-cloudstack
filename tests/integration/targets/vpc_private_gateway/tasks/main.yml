---
- name: setup vpc
  ngine_io.cloudstack.vpc:
    name: "{{ cs_resource_prefix }}_vpc"
    display_text: "{{ cs_resource_prefix }}_display_text"
    cidr: 10.10.0.0/16
    zone: "{{ cs_common_zone_adv }}"
  register: vpc
- name: verify setup vpc
  assert:
    that:
      - vpc is successful

- name: setup private gateway absent
  ngine_io.cloudstack.vpc_private_gateway:
    vpc: "{{ cs_resource_prefix }}_vpc"
    zone: "{{ cs_common_zone_adv }}"
    ip_address: 10.11.11.2
    state: absent
  register: private_gateway
- name: verify setup private gateway absent
  assert:
    that:
      - private_gateway is successful

- name: test fail missing vpc for private gateway
  ngine_io.cloudstack.vpc_private_gateway:
  ignore_errors: true
  register: private_gateway
- name: verify test fail missing vpc for private gateway
  assert:
    that:
      - private_gateway is failed
      - "private_gateway.msg.startswith('missing required arguments: ')"

- name: test fail missing create params for private gateway
  ngine_io.cloudstack.vpc_private_gateway:
    vpc: "{{ cs_resource_prefix }}_vpc"
    zone: "{{ cs_common_zone_adv }}"
    ip_address: 10.11.11.2
  ignore_errors: true
  register: private_gateway
- name: verify test fail missing create params for private gateway
  assert:
    that:
      - private_gateway is failed
      - 'private_gateway.msg == "state is present but all of the following are missing: gateway, netmask, vlan"'

- name: test create private gateway in check mode
  ngine_io.cloudstack.vpc_private_gateway:
    vpc: "{{ cs_resource_prefix }}_vpc"
    zone: "{{ cs_common_zone_adv }}"
    ip_address: 10.11.11.2
    gateway: 10.11.11.1
    netmask: 255.255.255.0
    vlan: "400"
  register: private_gateway
  check_mode: true
- name: verify test create private gateway in check mode
  assert:
    that:
      - private_gateway is successful
      - private_gateway is changed

- name: test create private gateway
  ngine_io.cloudstack.vpc_private_gateway:
    vpc: "{{ cs_resource_prefix }}_vpc"
    zone: "{{ cs_common_zone_adv }}"
    ip_address: 10.11.11.2
    gateway: 10.11.11.1
    netmask: 255.255.255.0
    vlan: "400"
  register: private_gateway
- name: verify test create private gateway
  assert:
    that:
      - private_gateway is successful
      - private_gateway is changed
      - private_gateway.ip_address == "10.11.11.2"
      - private_gateway.gateway == "10.11.11.1"
      - private_gateway.netmask == "255.255.255.0"
      - private_gateway.vlan == "vlan://400"
      - private_gateway.vpc == cs_resource_prefix + "_vpc"

- name: test create private gateway idempotence
  ngine_io.cloudstack.vpc_private_gateway:
    vpc: "{{ cs_resource_prefix }}_vpc"
    zone: "{{ cs_common_zone_adv }}"
    ip_address: 10.11.11.2
    gateway: 10.11.11.1
    netmask: 255.255.255.0
    vlan: "400"
  register: private_gateway
- name: verify test create private gateway idempotence
  assert:
    that:
      - private_gateway is successful
      - private_gateway is not changed
      - private_gateway.ip_address == "10.11.11.2"
      - private_gateway.vpc == cs_resource_prefix + "_vpc"

- name: test remove private gateway in check mode
  ngine_io.cloudstack.vpc_private_gateway:
    vpc: "{{ cs_resource_prefix }}_vpc"
    zone: "{{ cs_common_zone_adv }}"
    ip_address: 10.11.11.2
    state: absent
  register: private_gateway
  check_mode: true
- name: verify test remove private gateway in check mode
  assert:
    that:
      - private_gateway is successful
      - private_gateway is changed
      - private_gateway.ip_address == "10.11.11.2"

- name: test remove private gateway
  ngine_io.cloudstack.vpc_private_gateway:
    vpc: "{{ cs_resource_prefix }}_vpc"
    zone: "{{ cs_common_zone_adv }}"
    ip_address: 10.11.11.2
    state: absent
  register: private_gateway
- name: verify test remove private gateway
  assert:
    that:
      - private_gateway is successful
      - private_gateway is changed
      - private_gateway.ip_address == "10.11.11.2"

- name: test remove private gateway idempotence
  ngine_io.cloudstack.vpc_private_gateway:
    vpc: "{{ cs_resource_prefix }}_vpc"
    zone: "{{ cs_common_zone_adv }}"
    ip_address: 10.11.11.2
    state: absent
  register: private_gateway
- name: verify test remove private gateway idempotence
  assert:
    that:
      - private_gateway is successful
      - private_gateway is not changed

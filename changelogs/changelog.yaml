  3.0.0:
    changes:
      bugfixes:
      - Ensure tags are applied when creating or updating a template (https://github.com/ngine-io/ansible-collection-cloudstack/pull/154).
      major_changes:
      - Ensuring backwards compatibility and integration tests with CloudStack 4.17
        and 4.18.
      - General overhaul (black code style) and renaming of all modules (dropping
        ``cs_`` prefix) (https://github.com/ngine-io/ansible-collection-cloudstack/pull/141).
      - Update cs dependency to >=3.4.0.
    fragments:
    - 124-template-ensure-tags.yml
    - v3.yml
    modules:
    - description: Gathering information about configurations from Apache CloudStack
        based clouds.
      name: configuration_info
      namespace: ''
    release_date: '2025-10-22'
  3.1.0:
    changes:
      bugfixes:
      - portforward - Fixed rule creation for primary IP of default NIC (https://github.com/ngine-io/ansible-collection-cloudstack/issues/108)
      minor_changes:
      - firewall - Implemented support for ``dest_cidrs`` (https://github.com/ngine-io/ansible-collection-cloudstack/issues/76).
      - instance - Added a new argument ``match_display_name`` to control whether
        to find instances by display name (https://github.com/ngine-io/ansible-collection-cloudstack/pull/164).
      - instance - Improved return values related to user data (https://github.com/ngine-io/ansible-collection-cloudstack/pull/168).
      - instance - Optimized API query with keyword filtering resulting in reduced
        time consumption in larger environments (https://github.com/ngine-io/ansible-collection-cloudstack/pull/164).
      - inventory - Added option to use public ip as hostname (https://github.com/ngine-io/ansible-collection-cloudstack/pull/116).
      - inventory - Extended projects filter to allow project=-1, added project to
        returns (https://github.com/ngine-io/ansible-collection-cloudstack/pull/176).
      - network - Extended returns with ``public_ips`` and ``snat_ip`` (https://github.com/ngine-io/ansible-collection-cloudstack/issues/121).
      - role_permissions - Removed version check for EOL CloudStack version (https://github.com/ngine-io/ansible-collection-cloudstack/pull/168).
      removed_features:
      - The deprecated routing to module names with ``cs_`` prefix has been removed.
        Use the new module names instead.
    fragments:
